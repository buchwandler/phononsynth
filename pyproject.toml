[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phononsynth"
version = "0.1.0"
description = "Thin Phonon text-to-speech frontend backed by OnnxVoice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "onnxvoice>=0.2.10,<0.3",
  "tokenizers>=0.22,<0.23",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
huggingface = ["onnxvoice[huggingface]>=0.2.10,<0.3"]
cpu = ["onnxvoice[cpu]>=0.2.10,<0.3"]
gpu = ["onnxvoice[gpu]>=0.2.10,<0.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1"]

[project.scripts]
phononsynth = "phononsynth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phononsynth*"]

[tool.setuptools.package-data]
phononsynth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
