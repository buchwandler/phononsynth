name: Pre-commit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: pre-commit/action@v3.0.1
